# Explicit local demonstration profile. Resets the in-memory database at restart.
spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driverClassName: org.h2.Driver
    druid:
      master:
        driverClassName: org.h2.Driver
        url: jdbc:h2:mem:superfurniyure;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;NON_KEYWORDS=VALUE
        username: sa
        password: ''
      initialSize: 1
      minIdle: 1
      maxActive: 5
      maxWait: 10000
      connectTimeout: 10000
      socketTimeout: 30000
      validationQuery: SELECT 1
      testWhileIdle: true
      testOnBorrow: false
      testOnReturn: false
      timeBetweenEvictionRunsMillis: 60000
      minEvictableIdleTimeMillis: 300000
      maxEvictableIdleTimeMillis: 900000
      statViewServlet:
        enabled: false
      webStatFilter:
        enabled: false
  sql:
    init:
      mode: always
      encoding: UTF-8
      schema-locations: classpath:db/dev-schema.sql
      data-locations: classpath:db/dev-data.sql,classpath:db/zh-upgrade.sql,classpath:db/planning-upgrade.sql,classpath:db/planning-demo.sql,classpath:db/visual-refresh.sql
  h2:
    console:
      enabled: false
token:
  secret: ${TOKEN_SECRET:local-only-superfurniyure-change-before-production-12345}
furniture:
  bootstrap-password: ${ADMIN_INITIAL_PASSWORD:LocalDemo!2026}
