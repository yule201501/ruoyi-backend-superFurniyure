spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    druid:
      master:
        # DB_* remains authoritative for Docker/production; MYSQL_* supports local .env files.
        url: ${DB_URL:jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PUBLISHED_PORT:${MYSQL_CONTAINER_PORT:3306}}/${MYSQL_DATABASE:superfurniyure}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
        username: ${DB_USERNAME:${MYSQL_USER:superfurniyure}}
        password: ${DB_PASSWORD:${MYSQL_PASSWORD}}
      slave:
        enabled: false
      initialSize: 2
      minIdle: 2
      maxActive: 10
      maxWait: 10000
      connectTimeout: 10000
      socketTimeout: 30000
      validationQuery: SELECT 1
      testWhileIdle: true
      testOnBorrow: false
      testOnReturn: false
      timeBetweenEvictionRunsMillis: 60000
      minEvictableIdleTimeMillis: 300000
      maxEvictableIdleTimeMillis: 900000
      webStatFilter:
        enabled: false
      statViewServlet:
        enabled: false
